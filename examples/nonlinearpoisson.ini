gridsize_per_rank = 32 #Number of elements (each dimension) per subdomain
refine = 2
overlap = 2

[newton]
Reduction = 1e-8
VerbosityLevel = 2

[twolevelschwarz]
mode = multiplicative
overlap = 2
TwoLevel = true

[twolevelschwarz.fine]
type = restricted

[twolevelschwarz.fine.subdomain_solver]
type = umfpack

[twolevelschwarz.coarse]
type = umfpack

[twolevelschwarz.solver]
# reduction is set by the Newton solver
type      = bicgstabsolver
maxit     = 1000
verbose   = 2
