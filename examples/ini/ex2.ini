# Options of the convection-diffusion experiments with ex2 (see the header of ex2.cc). Combine this file with one of the
# preconditioners in methods/, later files and the command line override earlier ones:
#
#   mpirun -np 16 ./ex2 -config "examples/ini/ex2.ini examples/ini/methods/msgfem_ring.ini" -grid.refine 1
#
# The [prec] options here are those that all two-level methods share; the files in methods/ choose the preconditioner
# (and the one-level method overrides what does not apply to it).

[grid]
cells = 128 128               # elements per direction before the refinement, distributed with ParMETIS
refine = 0                    # global refinements after the distribution

[problem]
velocity_scale = 1            # scales the velocity b = (2/3, 1), and with it the Peclet number
kappa_dark = 1e-6             # diffusion coefficient of the dark squares of the checkerboard (the others have 1)

[solver]
type = gmres                  # left-preconditioned GMRES
reduction = 1e-8              # of the preconditioned residual
maxit = 500
restart = 500                 # no restarts, so that the iteration counts of all methods are comparable
verbosity = 1

[prec]
# Two-level Schwarz with restricted additive Schwarz on the fine level and the coarse correction after it (deflated):
# y = M^{-1} r, z = y + Q (r - A y)
coarse_mode = deflated
overlap = 8                   # layers of elements added to the subdomains of the ParMETIS partition
pou.layers = 4                # the partition of unity lives on the inner 4 layers, the outer 4 are the oversampling layers

[prec.fine]
variant = restricted
subdomain_prec.type = pardiso # the subdomain matrix with Dirichlet rows on the outermost layer (B_II): the RAS solves,
                              # and the harmonic extensions of MS-GFEM (solves with many right-hand sides)

[prec.coarse]
prec.type = pardiso           # the coarse problem, gathered and factorised on rank 0

[prec.coarse_space.eigensolver]
type = lanczos                # block thick-restart Lanczos
nev = 20                      # eigenvectors per subdomain, the same for all methods
blocksize = 4
tolerance = 1e-5
shift = -1e-3                 # below the spectrum, the Neumann matrices of floating subdomains are singular
prec.type = pardiso           # the shift-invert solves (not used by the ring variant, which has its own, see methods/)

[output]
vtk = false

[timing]
barriers = true               # phase barriers, see read_config() in examples/run.hh
