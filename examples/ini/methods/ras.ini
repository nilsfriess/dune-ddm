# One-level restricted additive Schwarz, the non-robust reference without a coarse space. The same subdomains as the
# two-level methods (prec.overlap), but the partition of unity lives on the whole overlap, there is no oversampling.
[prec]
type = schwarz
variant = restricted
pou.layers = 8                # = prec.overlap
subdomain_prec.type = pardiso
