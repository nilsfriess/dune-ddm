# MS-GFEM coarse space for symmetric problems: the projection onto the A-harmonic functions (solves with B_II,
# factorised by the fine level) is applied once, after the shift-invert solve with the Neumann matrix. For a symmetric
# A (velocity_scale = 0 in ex2 and ex6) this is the same eigenproblem as the saddle point method and two_sided, with one
# projection per Lanczos step instead of two (two_sided) or a factorisation of the saddle point matrix
[prec]
type = tlschwarz
coarse_space_type = msgfem

[prec.coarse_space]
method = projected

[prec.coarse_space.eigensolver]
prec.mtype = 2                # PARDISO: real symmetric positive definite
