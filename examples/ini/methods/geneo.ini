# GenEO coarse space as a robust reference that is not MS-GFEM: the eigenproblem A_neu v = lambda D A_neu D v on the
# overlapping subdomain, without the harmonic constraint. With a symmetric matrix attached to A (ex2, ex6: the
# diffusion), A_neu is its Neumann matrix, i.e. Delta-GenEO (arXiv:2103.16703). The shift-invert solves only need the
# Neumann matrix (factorised as symmetric indefinite, see below), one per Lanczos step and no projections
[prec]
type = tlschwarz
coarse_space_type = geneo

[prec.coarse_space.eigensolver]
prec.mtype = -2               # PARDISO: real symmetric indefinite. The Cholesky factorisation (mtype 2) of the shifted
                              # Neumann matrix of a floating subdomain can break down: 64 subdomains of 12^3 or 20^3 cells
                              # (channels, contrast 1e6) hung; -2 costs about the same
