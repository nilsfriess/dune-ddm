# MS-GFEM coarse space, new method with eta = omega: the B-harmonic functions are measured in the energy of the
# A-harmonic extension of their trace on the whole subdomain (A = the symmetric part, here the diffusion). The constraint
# is enforced by the projection onto the B-harmonic functions (solves with B_II, factorised by the fine level), applied
# on both sides of the shift-invert solves, which only need the Neumann matrix of A (symmetric positive definite after the shift).
[prec]
type = tlschwarz
coarse_space_type = msgfem

[prec.coarse_space]
method = two_sided
inner_product = subdomain

[prec.coarse_space.eigensolver]
prec.mtype = 2                # PARDISO: real symmetric positive definite
