# MS-GFEM coarse space, the baseline: the eigenproblem on the B-harmonic functions with the constraint enforced by
# Lagrange multipliers (saddle point system with one multiplier per interior dof). The shift-invert solves factorise
# the saddle point matrix, which is symmetric indefinite.
[prec]
type = tlschwarz
coarse_space_type = msgfem

[prec.coarse_space]
method = saddle_point
inner_product = subdomain

[prec.coarse_space.eigensolver]
prec.mtype = -2               # PARDISO: real symmetric indefinite
