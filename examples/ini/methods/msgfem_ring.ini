# MS-GFEM coarse space, new method with eta = ring: as msgfem.ini, but the A-harmonic extension and its energy only live
# on a ring along the subdomain boundary (the overlap and two more layers), so the shift-invert solves only factorise the
# Neumann matrix on the ring
[prec]
type = tlschwarz
coarse_space_type = msgfem

[prec.coarse_space]
method = two_sided
inner_product = ring
ring_prec.type = pardiso
ring_prec.mtype = -2          # PARDISO: real symmetric indefinite. With the shift -1e-9, the Neumann matrix of a floating
                              # ring is so close to singular that the Cholesky factorisation (mtype 2) can break down
                              # (64 subdomains of 12^3 cells: PARDISO error on 60 of 64 ranks)

[prec.coarse_space.eigensolver]
shift = -1e-9                 # the projection lies outside of the shifted solve, so the shift changes the eigenproblem:
                              # it must lie far below the high-contrast eigenvalues (~1/contrast). With the default
                              # -1e-3, the 3D random/channels runs needed up to 5x more iterations than saddle_point
