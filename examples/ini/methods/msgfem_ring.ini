# MS-GFEM coarse space, new method with eta = ring: as msgfem.ini, but the A-harmonic extension and its energy only live
# on a ring along the subdomain boundary (the overlap and two more layers), so the shift-invert solves only factorise the
# Neumann matrix on the ring
[prec]
type = tlschwarz
coarse_space_type = msgfem

[prec.coarse_space]
method = two_sided
inner_product = ring
ring_prec.type = pardiso
ring_prec.mtype = 2           # PARDISO: real symmetric positive definite
