# The MS-GFEM-ring method of arXiv:2507.12226 (coarse_space_type msgfem_ring): the MS-GFEM eigenproblem posed only on
# a ring along the boundary of the overlapping subdomain (the overlap, where D is not 1, and two more layers), with
# the eigenvectors extended into the subdomain from the ring (extension from_ring, the variant analysed in the paper;
# from_boundary extends from the outermost layer with the fine-level solver instead). NOT the same as msgfem_ring.ini,
# which is the new method of the DD30 talk with inner_product ring. On the ring, the harmonic constraint is enforced
# with Lagrange multipliers (method saddle_point, exact for any shift), factorised as symmetric indefinite.
[prec]
type = tlschwarz
coarse_space_type = msgfem_ring

[prec.coarse_space]
extension = from_ring
method = saddle_point
extension_prec.type = pardiso # the extension from the ring (default: UMFPACK, sequential), like all other factorisations
extension_prec.mtype = 11     # PARDISO: real nonsymmetric (the convection-diffusion matrix)

[prec.coarse_space.eigensolver]
prec.mtype = -2               # PARDISO: real symmetric indefinite
