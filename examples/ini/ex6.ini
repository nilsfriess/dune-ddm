# Options of the 3D convection-diffusion experiments with ex6 (see the header of ex6.cc). Combine this file with one of
# the preconditioners in methods/, later files and the command line override earlier ones:
#
#   mpirun -np 64 ./ex6 -config "examples/ini/ex6.ini examples/ini/methods/msgfem_ring.ini" -grid.refine 1
#
# The [prec] options here are those that all two-level methods share; the files in methods/ choose the preconditioner
# (and the one-level method overrides what does not apply to it).

[grid]
cells = 16 16 16              # elements per direction before the refinement, distributed with ParMETIS
refine = 2                    # global refinements after the distribution

[problem]
velocity_scale = 1            # scales the velocity, and with it the Peclet number
swirl = 1                     # strength of the vortex around the vertical axis, relative to the upward flow
coefficient = checkerboard    # checkerboard | channels, see the header of ex6.cc
kappa_light = 1               # checkerboard: diffusion coefficient of the light cubes
kappa_dark = 1e-6             # checkerboard: diffusion coefficient of the dark cubes
checkers = 8                  # checkerboard: cubes per direction
kappa_channel = 1e6           # channels: diffusion coefficient in the rods, which run through the whole cube
kappa_background = 1          # channels: diffusion coefficient elsewhere
channels = 16                 # channels: slices in z, and rods per slice (along x and y in turn)
channel_width = 0.03125       # channels: side of the square cross section of the rods (1/32: 2 elements at 64^3)
spot = 0.5 0.25 0             # centre of the Gaussian spot of the inflow data on the bottom face
spot_width = 0.06

[solver]
type = gmres                  # left-preconditioned GMRES
reduction = 1e-8              # of the preconditioned residual
maxit = 500
restart = 500                 # no restarts, so that the iteration counts of all methods are comparable
verbosity = 1

[prec]
# Two-level Schwarz with restricted additive Schwarz on the fine level and the coarse correction after it (deflated):
# y = M^{-1} r, z = y + Q (r - A y)
coarse_mode = deflated
overlap = 4                   # layers of elements added to the subdomains of the ParMETIS partition

[prec.fine]
variant = restricted
pou.layers = 2                # the partition of unity lives on the inner 2 layers, the outer 2 are the oversampling layers
                              # (here and not in [prec], so that one-level RAS uses the whole overlap)
subdomain_prec.type = pardiso # the subdomain matrix with Dirichlet rows on the outermost layer (B_II): the RAS solves,
                              # and the harmonic extensions of MS-GFEM (solves with many right-hand sides)

[prec.coarse]
prec.type = pardiso           # the coarse problem, gathered and factorised on rank 0

[prec.coarse_space.eigensolver]
type = lanczos                # block thick-restart Lanczos
nev = 40                      # eigenvectors per subdomain, the same for all methods
blocksize = 4
tolerance = 1e-5
shift = -1e-3                 # below the spectrum, the Neumann matrices of floating subdomains are singular
prec.type = pardiso           # the shift-invert solves (not used by the ring variant, which has its own, see methods/)

[output]
vtk = false

[timing]
barriers = true               # phase barriers, see read_config() in examples/run.hh
