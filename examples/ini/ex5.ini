# Options of the Helmholtz experiments with ex5 (see the header of ex5.cc) on the Marmousi model, in the setup of Ma et
# al. 2025 (Table 4): the upper left 9 km x 3 km of the model, a free surface at the top and the impedance condition on
# the other sides, the source at the surface at x = 6 km. The velocity model is not set here, pass it on the command line
# (data/marmousi_vp.ini of the source tree, its data is downloaded by data/download_models.sh):
#
#   mpirun -np 32 ./ex5 -config examples/ini/ex5.ini -problem.velocity data/marmousi_vp.ini -problem.frequency 10
#
# The grid has 60 f x 20 f cells (f the frequency in Hz) refined once, i.e. 20 P2 elements per shortest wavelength
# (c_min = 1.5 km/s); the default is that grid for 10 Hz. Only MS-GFEM, with the method chosen by
# prec.coarse_space.method (and inner_product): the files in methods/ are for the real problems of ex2 and ex6, their
# PARDISO matrix types do not apply to the complex matrices here.

[problem]
frequency = 10                # in Hz
extent = 9 3                  # in km, the upper left part of the model
source = 6 3                  # in km, at the surface
free_surface = true           # u = 0 at the top, impedance on the other sides

[grid]
cells = 600 200               # elements per direction before the refinement, distributed with ParMETIS
refine = 1                    # global refinements after the distribution

[solver]
type = gmres                  # left-preconditioned GMRES
reduction = 1e-6              # of the preconditioned residual
maxit = 200
restart = 200                 # no restarts, so that the iteration counts of all methods are comparable
verbosity = 1

[prec]
# Two-level Schwarz with restricted additive Schwarz on the fine level and the coarse correction after it (deflated)
type = tlschwarz
coarse_mode = deflated
overlap = 8                   # layers of elements added to the subdomains of the ParMETIS partition
coarse_space_type = msgfem

[prec.fine]
variant = restricted
pou.layers = 4                # the partition of unity is positive on the subdomain and the first 3 overlap layers, the
                              # outer 5 overlap layers are oversampling
subdomain_prec.type = pardiso # the Helmholtz matrix with Dirichlet rows on the outermost layer (complex nonsymmetric,
                              # PARDISO's default mtype 13): the RAS solves and the projections of two_sided

[prec.coarse]
prec.type = pardiso           # the coarse problem, gathered and factorised on rank 0

[prec.coarse_space]
method = two_sided            # saddle_point | two_sided (with inner_product = ring: the ring variant)
inner_product = subdomain
ring_prec.type = pardiso      # only with inner_product = ring: the Neumann matrix of the energy form on the ring
ring_prec.mtype = -4          # PARDISO: complex Hermitian indefinite

[prec.coarse_space.eigensolver]
type = lanczos                # block thick-restart Lanczos
nev = 50                      # eigenvectors per subdomain, the same for all methods
blocksize = 8
tolerance = 1e-5
shift = 0                     # the k-weighted energy form is positive definite, no shift needed (a shift perturbs the
                              # eigenpairs of two_sided)
prec.type = pardiso           # the shift-invert solves: the Neumann matrix of the energy form (two_sided) or the saddle
prec.mtype = -4               # point matrix (saddle_point), both complex Hermitian: PARDISO's Hermitian indefinite
                              # factorisation, same iterations as the default 13 (nonsymmetric) and about 10% faster

[output]
vtk = false

[timing]
barriers = true               # phase barriers, see read_config() in examples/run.hh
