[grid]
type = simplex # simplex or cube (ALUGrid, nonconforming), ug-simplex or ug-cube (UGGrid)
cells = 16     # cells per direction before refinement
refine = 0
file =         # optional gmsh mesh of the unit square (simplex, ug-simplex): unstructured grid

[space]
entityset = all # all (ghost cells included) or overlapping (ghosts left out: borders act as walls)

trial_constraints = false # true: ghost constraints on the trial space too (as in convectiondiffusiondg.cc)

[parallel]
matrix_is_additive = false # ghost rows are zero (test-space constraints), the solver makes the matrix additive

[twolevelschwarz]
overlap = 2
mode = multiplicative

[twolevelschwarz.fine]
type = restricted

[twolevelschwarz.fine.subdomain_solver]
type = umfpack

[twolevelschwarz.coarse]
type = umfpack

[twolevelschwarz.solver]
type      = restartedgmressolver
reduction = 1e-8
maxit     = 300
restart   = 50
verbose   = 1
