# Visualization
visualise = true
view_report = true
filename = pdelab_example

# Grid configuration
gridsize = 512
refine = 0
overlap = 4
debug_rank = 14
grid_overlap = 0

# Coarse space configuration
# domain:         full | ring
# constraint:     none | harmonic
# constraint_evp: lagrange_multiplier | alternating | randsvd  (only for constraint = harmonic; randsvd only for domain = full)
# ring_extension: from_ring | from_boundary          (only for domain = ring)
# neumann:        assembled | algebraic
#
# NOTE: The 'alternating' approach does produce correct results for non-symmetric problems.
#
# With neumann = algebraic the Neumann matrix is not assembled element-wise but approximated from
# the assembled subdomain matrix, which makes the coarse space algebraic. Only supported for
# domain = full. Everything else about the coarse space is unchanged, so switching this key
# isolates the effect of the approximation.
#
# For a non-symmetric problem the algebraic Neumann matrix is replaced by its symmetric part
# (A + A^T)/2, which for a divergence-free velocity field removes exactly the convection. This is a
# different surrogate from the one the assembled path uses (a separate assembly of the elliptic part
# of the PDE), so for such problems the two settings do not only differ by the approximation.
#
[coarsespace]
domain = full
constraint = harmonic
constraint_evp = randsvd
ring_extension = from_boundary
neumann = assembled

# Partition of unity configuration
[pou]
type = distance # msfem
shrink = 3

# Combined preconditioner mode
[combined_preconditioner]
mode = multiplicative

# Fine level (Schwarz) preconditioner
[schwarz]
type = restricted

[schwarz.subdomain_solver]
type = umfpack


# Coarse solver configuration
[coarse_solver]
type = umfpack


[coarsespace.eigensolver]
type      = Spectra
nev       = 32
nev_max   = 128
# ncv       = 48   # randsvd: number of random samples (default 2 * nev)
shift     = -0.001
maxit     = 1000
tolerance = 1e-8
threshold = -0.8

[coarsespace.eigensolver.solver]
type = umfpack


# Solver for the harmonic extension (A_sub with the subdomain boundary eliminated),
# used by constraint_evp = alternating | randsvd and by domain = ring
[harmonic_extension_solver]
type = umfpack

# Outer solver
[solver]
type      = restartedgmressolver # restartedgmressolver
reduction = 1e-8
maxit     = 100
restart   = 50
verbose   = 4
