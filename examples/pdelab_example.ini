modify_subdomain_matrix = true

# Visualization
visualise = true
view_report = true
filename = pdelab_example

# Grid configuration
gridsize = 64
refine = 0
overlap = 4
debug_rank = 2

# Coarse space configuration
[coarsespace]
type = constraint_geneo # msgfem_ring # msgfem_dirichlet

# Partition of unity configuration
[pou]
type = distance # distance
shrink = 2

# Combined preconditioner mode
[combined_preconditioner]
mode = multiplicative

# Fine level (Schwarz) preconditioner
[schwarz]
type = restricted

[schwarz.subdomain_solver]
type = umfpack

# Coarse solver configuration
[coarse_solver]
type = umfpack

[coarse_space]
n = 32
add_constant = false
use_elimination = true

[coarse_space.eigensolver]
type      = trl
nev       = 8
ncv       = 32
shift     = -0.001
maxit     = 1000
tolerance = 1e-12
#threshold = 0.05

# Outer solver
[solver]
type      = restartedgmressolver # cgsolver
reduction = 1e-8
maxit     = 100
restart   = 50
verbose   = 4
