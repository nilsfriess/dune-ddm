# The original Marmousi P-wave velocity model (Versteeg 1994), 9.2 km x 3.004 km, velocities from 1500 to 5500 m/s.
# Raw little-endian float32 in m/s, value of trace ix at depth sample iz at index ix * nz + iz, iz = 0 at the surface.
# The data file is not in the repository, download it with download_models.sh.
file = marmousi_vp.bin
nx = 2301
nz = 751
dx = 4
dz = 4
